name: Build with Qwen Studio adapter

# Separate workflow from build.yml on purpose: the existing file keeps its own
# artifact name and trigger behaviour, while this one adds the Qwen Studio host
# adapter and runs its self-test as part of the build. Keeping them apart means a
# regression in the adapter cannot change what the upstream build produces.

on:
  push:
    branches: [main]
    paths:
      - 'module/src/com/dsmod/probe/qwen/**'
      - '.github/workflows/build-qwen.yml'
  pull_request:
    paths:
      - 'module/src/com/dsmod/probe/qwen/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        # v4 resolves the cmdline-tools that still ship the `tools` package;
        # v3 bootstraps one where `sdkmanager "tools"` fails with
        # "Failed to find package 'tools'" on current runner images.
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # The Tier B pipeline links against the Xposed API, so the in-tree stubs
      # from module-legacy must be on the classpath before the adapter compiles.
      - name: Compile Xposed API stubs
        run: |
          set -euo pipefail
          ANDROID_JAR="${ANDROID_SDK_ROOT}/platforms/android-35/android.jar"
          mkdir -p build/xstub
          find module-legacy/src -name '*.java' > build/xstub-sources.txt
          javac -proc:none -source 8 -target 8 \
            -cp "$ANDROID_JAR" \
            -d build/xstub \
            @build/xstub-sources.txt
          echo "--- stub classes:"
          find build/xstub -name '*.class' | sort

      # The adapter must compile against the real platform jar before we spend
      # time on the full module build; a failure here is cheaper to read.
      - name: Compile Qwen adapter against Android platform jar
        run: |
          set -euo pipefail
          ANDROID_JAR="${ANDROID_SDK_ROOT}/platforms/android-35/android.jar"
          test -f "$ANDROID_JAR"
          mkdir -p build/qwen-adapter
          javac -proc:none -source 8 -target 8 \
            -cp "$ANDROID_JAR:build/xstub" \
            -d build/qwen-adapter \
            module/src/com/dsmod/probe/qwen/*.java
          echo "--- classes produced:"
          find build/qwen-adapter -name '*.class' | sort

      - name: Run Qwen adapter self-test
        run: |
          set -euo pipefail
          ANDROID_JAR="${ANDROID_SDK_ROOT}/platforms/android-35/android.jar"
          java -cp "$ANDROID_JAR:build/xstub:build/qwen-adapter" \
            com.dsmod.probe.qwen.QwenAdapterSelfTest | tee build/selftest.txt
          grep -q '^RESULT: PASS' build/selftest.txt
          FAILED=$(grep -c '^FAIL' build/selftest.txt || true)
          PASSED=$(grep -c '^PASS' build/selftest.txt || true)
          echo "passed=${PASSED:-0} failed=${FAILED:-0}"
          test "${FAILED:-0}" -eq 0
          # Tier B added assertions on top of the Tier A 42; a regression that
          # drops back to the Tier A count means the new checks stopped running.
          test "${PASSED:-0}" -ge 85

      # Prove the adapter source actually reaches the module build. The
      # maxdepth 1 scan in build.sh cannot reach a sub-package, so this checks
      # the second find line is present and effective.
      - name: Verify adapter is collected by the module build
        run: |
          set -euo pipefail
          COLLECTED=$(find module/src/com/dsmod/probe/qwen -name '*.java' | wc -l)
          echo "adapter sources: $COLLECTED"
          test "$COLLECTED" -ge 12
          grep -q 'com/dsmod/probe/qwen' module-universal/build.sh

      - name: Prepare local debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore module/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -dname 'CN=Android Debug,O=Android,C=US' \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Build source edition with Qwen adapter
        # Not `scripts/build-all.sh`: that script runs the upstream regression
        # suite after the APKs are already built, and HistoryBridgeRegressionTest
        # fails on its own checked-in mojibake (it asserts on the literal
        # "璁剧疆蹇冭烦 to " but the file carries double-encoded bytes). That failure
        # is pre-existing and unrelated to the adapter. Upstream build.yml still
        # exercises it; this job builds the same two APKs and skips it.
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          mkdir -p dist
          ( cd module-universal && bash build.sh )
          ( cd module-universal && GOOGLE_PLAY_BUILD=true bash build.sh )
          cp module-universal/ds-probe-universal.apk \
             dist/deekseep-universal-with-qwen-adapter.apk
          cp module-universal/ds-probe-universal-google-play.apk \
             dist/deekseep-google-play-with-qwen-adapter.apk
          ls -l dist/

      - name: Verify APK signatures and adapter packaging
        run: |
          set -euo pipefail
          source scripts/android-tools.sh
          for apk in dist/*.apk; do
            echo "== $apk"
            "$APKSIGNER" verify "$apk"
            unzip -l "$apk" | grep -q 'assets/xposed_init'
            unzip -p "$apk" classes.dex > build/verify.dex
            for cls in QwenAdapterEntry QwenHost QwenPaths QwenCompat QwenChatPipeline QwenSymbols; do
              strings build/verify.dex | grep -q "$cls" \
                || { echo "$cls missing from $apk" >&2; exit 1; }
            done
            echo "   adapter classes present"
          done

      - name: Checksums
        run: |
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: deekseep-qwen-adapter
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload self-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-adapter-selftest
          path: build/selftest.txt
          if-no-files-found: warn
          retention-days: 14

